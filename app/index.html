<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Study Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: persistent left menu (Overview, Calendar, To-Do, Grades, Shortcuts) beside one working pane; bottom tab bar on phones.
   Motif: the optical answer sheet. Task checkboxes are filled-in bubbles, dates and scores are set in mono. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#171A23; --muted:#5F6B85; --line:#E0E4EC;
  --accent:#2540D9; --accent-ink:#FFFFFF; --accent-soft:#E8ECFD;
  --exam:#D6336C; --assign:#2540D9; --project:#0B8F63; --other:#7C8499;
  --warn:#9A4A08; --warn-soft:#FDF0E3; --danger:#C92A2A;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --side:244px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141B; --surface:#1A1E28; --ink:#E8EBF2; --muted:#98A2B8; --line:#2A303D;
    --accent:#8393FF; --accent-ink:#0E1220; --accent-soft:#232A4A;
    --exam:#F06595; --assign:#8393FF; --project:#3DD6A0; --other:#98A2B8;
    --warn:#F0B06A; --warn-soft:#2D2416; --danger:#FF8787;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#1A1E28; --ink:#E8EBF2; --muted:#98A2B8; --line:#2A303D;
  --accent:#8393FF; --accent-ink:#0E1220; --accent-soft:#232A4A;
  --exam:#F06595; --assign:#8393FF; --project:#3DD6A0; --other:#98A2B8;
  --warn:#F0B06A; --warn-soft:#2D2416; --danger:#FF8787;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.6 var(--f-body);
  padding-block:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.t-exam{--c:var(--exam)} .t-assignment{--c:var(--assign)} .t-project{--c:var(--project)} .t-other{--c:var(--other)}

/* app shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);gap:36px;max-width:1320px;margin:0 auto;align-items:start}
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:30px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 18px;max-height:calc(100vh - 40px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:6px}
.brand-mark i{border-radius:50%;border:1.5px solid var(--surface)}
.brand-mark i:nth-child(2){background:var(--surface)}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 12px 10px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:11px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:var(--bg);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-badge{margin-left:auto;font-family:var(--f-mono);font-size:12px;background:var(--bg);color:var(--ink);border-radius:20px;padding:0 8px}
.nav-btn[aria-current="page"] .nav-badge{background:var(--surface)}
.qlink{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:14px}
.qlink:hover{background:var(--bg)}
.qlink .tile{width:24px;height:24px;border-radius:6px;font-size:12px}
.qlink span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}

.main{min-width:0;display:flex;flex-direction:column;gap:32px}
#view{min-width:0;display:flex;flex-direction:column;gap:32px}
.topbar{display:none}
.tabbar{display:none}

@media (max-width:859px){
  .app{grid-template-columns:minmax(0,1fr);gap:24px;padding-bottom:84px}
  #view,.main{gap:24px}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .tabbar{
    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;border-radius:8px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
  .tab svg{width:20px;height:20px}
  .tab[aria-current="page"]{color:var(--accent)}
}
</style>
<style>
/* shared controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn.quiet:hover{background:var(--bg);color:var(--ink)}
.icon-btn{width:34px;height:34px;padding:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}
.field{display:grid;gap:7px;min-width:0}
.field>span{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:16px}
.panel-b{padding:22px}
.empty{padding:28px 22px;color:var(--muted);font-size:14px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--other)}
.status[data-s="synced"] i{background:var(--project)}
.status[data-s="saving"] i{background:var(--accent)}
.status[data-s="error"] i{background:var(--danger)}

/* view header */
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.view-head h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.02em}
.view-head .sub{color:var(--muted);margin-top:4px}
.view-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--line);border-radius:10px;padding:14px 20px;font-size:14px}
.banner .btn{margin-left:auto}

/* type chips + bubbles */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:color-mix(in srgb,var(--c,var(--other)) 14%,transparent);color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--other))}
.course{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:transparent;padding:0;cursor:pointer;flex:none}
.bubble:hover{border-color:var(--ink)}
.bubble[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}

/* overview */
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.glance>div{padding:20px 24px;border-right:1px solid var(--line);min-width:0}
.glance>div:last-child{border-right:0}
.glance .k{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.glance .v{font-family:var(--f-mono);font-size:24px;font-weight:500;margin-top:2px;white-space:nowrap}
.glance .n{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px}
.agenda{list-style:none;margin:0;padding:0}
.agenda li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:15px 22px;border-bottom:1px solid var(--line)}
.agenda li:last-child{border-bottom:0}
.agenda .d{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);line-height:1.25}
.agenda .d b{display:block;color:var(--ink);font-size:15px;font-weight:500}
.agenda .t{min-width:0}
.agenda .t strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.rel.hot{color:var(--exam);font-weight:500}
.rel.late{color:var(--danger);font-weight:500}

/* calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cal-bar h2{font-size:22px;min-width:9ch}
.cal-nav{display:flex;gap:6px;align-items:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dow{background:var(--surface);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:8px 0}
.day{background:var(--surface);min-height:120px;padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px;border:0;border-radius:0;min-width:0;overflow:hidden}
.day:hover{background:var(--bg)}
.day.out .num{opacity:.4}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.num{font-family:var(--f-mono);font-size:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.day.today .num{background:var(--accent);color:var(--accent-ink);font-weight:500}
.ev{font-size:11.5px;line-height:1.3;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 15%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{text-decoration:line-through;opacity:.6}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dayp .panel-h{align-items:flex-start}
.dayp h3{font-size:17px}
.dayp .sub{font-size:13px;color:var(--muted)}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 22px;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:0}
.items .tt{min-width:0}
.items .tt strong{display:block;font-weight:600;overflow-wrap:anywhere}
.items .tt .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.items.done .tt strong{text-decoration:line-through;color:var(--muted)}
@media (max-width:1100px){.cal-wrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .day{min-height:58px;align-items:center}
  .ev,.more{display:none}
  .dots{display:flex;justify-content:center}
  .legend{display:none}
}

/* to-do */
.addbar{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 150px auto;gap:16px;align-items:end;padding:22px;border-bottom:1px solid var(--line)}
@media (max-width:760px){.addbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.addbar .field:first-child{grid-column:1/-1}.addbar .btn{grid-column:1/-1}}
.tabs{display:flex;gap:6px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{background:none;border:0;border-radius:8px;padding:6px 12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg b{font-family:var(--f-mono);font-weight:500;margin-left:4px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .tt{min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.task .tt strong{display:block;font-weight:600;overflow-wrap:anywhere}
.task.done .tt strong{text-decoration:line-through;color:var(--muted)}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}
@media (max-width:560px){.task{grid-template-columns:auto minmax(0,1fr) auto}.task .rel{grid-column:2}.task .x{grid-row:1;grid-column:3}}

/* grades */
.g-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.g-course .panel-h .avg{font-family:var(--f-mono);font-size:20px;font-weight:500}
.g-row{display:grid;grid-template-columns:minmax(0,1.4fr) 96px minmax(90px,1fr) 92px auto;gap:16px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-row .tt strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.score{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.score small{color:var(--muted)}
@media (max-width:720px){.g-row{grid-template-columns:minmax(0,1fr) auto auto}.g-row .bar{grid-column:1/-1;grid-row:2}.g-row .mono.dt{display:none}}

/* shortcuts */
.tile{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;background:var(--tc,#4b5ad6);flex:none}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.lk{position:relative;display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:inherit;min-width:0}
a.lk:hover{border-color:var(--accent)}
.lk .tx{min-width:0}
.lk .tx strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .tx span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk.add{border-style:dashed;background:none;color:var(--muted);font-weight:600;cursor:pointer;justify-content:center;min-height:68px}
.lk .rm{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--danger);line-height:1}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,10,16,.55);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(540px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:grid;gap:22px}
.modal h2{font-size:22px}
.types{display:flex;gap:6px;flex-wrap:wrap}
.type-btn{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-weight:600;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.type-btn[aria-pressed="true"]{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 14%,transparent)}
.type-btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.actions .grow{margin-right:auto}
.err{color:var(--danger);font-size:13px;min-height:1em}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .14s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:0}}}
</style>
<style>
/* Polish: rounder surfaces, bento summary row, frosted overlays, restrained motion */
body{background-image:radial-gradient(1100px 460px at 88% -8%,color-mix(in srgb,var(--accent) 8%,transparent),transparent)}
.side,.panel{border-radius:20px}
.modal{border-radius:22px;box-shadow:0 30px 80px -30px rgba(10,15,40,.5)}
.cal-grid{border-radius:16px}
.btn,input,select,textarea{border-radius:10px}
.lk{border-radius:16px}
.view-head h1{letter-spacing:-.03em}

/* bento summary row: separate tiles, the first one is the accent */
.glance{border:0;background:none;border-radius:0;overflow:visible;gap:16px}
.glance>div{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 24px}
.glance>div:last-child{border-right:1px solid var(--line)}
.glance .v{font-size:28px;letter-spacing:-.02em;line-height:1.2;white-space:normal;overflow-wrap:anywhere}
@media (max-width:480px){.glance>div{padding:18px}.glance .v{font-size:23px}}
/* the first tile is marked with the accent color on its border; its fill and text follow the theme like the others */
.glance>div:first-child{border-color:var(--accent)}

/* frosted layers */
.overlay{background:rgba(8,10,16,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
@media (max-width:859px){
  .tabbar{background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
}

/* pointer spotlight (set by script; mouse and pen only) */
@media (hover:hover){
  .panel:hover,.lk:not(.add):hover,.glance>div:hover{
    background-image:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 11%,transparent),transparent 72%);
  }
}

@media (prefers-reduced-motion:no-preference){
  .btn,.nav-btn,.lk,.seg,.type-btn,.day{transition:transform .16s ease,border-color .16s ease,background-color .16s ease,box-shadow .2s ease,filter .16s ease}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0) scale(.98)}
  a.lk:hover{transform:translateY(-2px);box-shadow:0 14px 28px -16px rgba(20,30,80,.4)}
  .overlay{animation:fade .18s ease-out}
  #view.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards}
  #view.enter>*:nth-child(2){animation-delay:.05s}
  #view.enter>*:nth-child(3){animation-delay:.1s}
  #view.enter>*:nth-child(4){animation-delay:.15s}
  #view.enter>*:nth-child(n+5){animation-delay:.2s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}
  @keyframes fade{from{opacity:0}}
}
</style>
<style>
/* GSAP layer */
#sd-progress{position:fixed;left:0;right:0;top:0;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;opacity:0;z-index:40;pointer-events:none}
.has-gsap .overlay{animation:none}
.lk.editing .tile{cursor:grab;touch-action:none}
.lk.editing{padding-bottom:52px}
.lk.editing .tx{padding-right:22px}
.lk.dragging{cursor:grabbing;box-shadow:0 22px 44px -18px rgba(20,30,80,.55);border-color:var(--accent)}
.lk .mvs{position:absolute;left:18px;bottom:12px;display:flex;gap:6px}
.lk .mv{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1;font-size:16px}
.lk .mv:hover{border-color:var(--accent)}
.drag-hint{font-size:13px;color:var(--muted);margin-bottom:14px}
</style>
<style>
/* AI Tutor */
.tabbar.has-tutor{grid-template-columns:repeat(6,minmax(0,1fr))}
.ai-panel{max-width:720px}
.ai-form{display:grid;gap:14px}
.ai-note{font-size:13px;color:var(--muted);line-height:1.5}
.ai-note[hidden]{display:none}
.ai-note.warn{color:var(--danger)}
.ai-check{display:flex;align-items:center;gap:8px;font-size:14px}
.ai-check input{width:auto}
.ai-test{min-height:1.4em;font-size:14px}
.ai-form .actions{display:flex;flex-wrap:wrap;gap:10px}
.ai-fs{border:0;padding:0;margin:0;display:grid;gap:14px;min-width:0}
.ai-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ai-status{font-size:14px;color:var(--muted)}
.ai-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.ai-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.ai-courses,.ai-lessons{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ai-courses{padding:16px 22px 22px}
.ai-course-card{display:grid;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);cursor:pointer;font:inherit}
.ai-course-card:hover{border-color:var(--muted)}
.ai-lesson-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ai-lesson-row .sub{display:block}
.ai-num{width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.ai-state{font-size:13px;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.ai-row{grid-template-columns:1fr}.ai-lesson-row{grid-template-columns:32px minmax(0,1fr);}.ai-lesson-row .ai-state,.ai-lesson-row .btn{grid-column:2;justify-self:start}}
.ai-top{display:flex}
.ai-sec h4,.ai-chat h4,#ai-quiz-form h4,#ai-quiz-result h4{margin:0 0 6px;font-size:15px}
.ai-sec{display:grid;gap:6px}
.ai-sec p,.ai-sec ul,.ai-sec ol{margin:0 0 6px}
.ai-example{background:var(--bg);border-radius:12px;padding:12px 14px}
.ai-qs{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.ai-opts{display:grid;gap:6px;list-style:none;margin:6px 0 0;padding:0}
.ai-opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.ai-opt input{width:auto;margin-top:3px}
.ai-opt.right{border-color:var(--accent)}
.ai-opt.wrong{border-color:var(--danger)}
.ai-ok{color:var(--accent)}.ai-bad{color:var(--danger)}
.ai-expl{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.ai-chat{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.ai-msgs{display:grid;gap:8px}
.ai-msg{border-radius:12px;padding:10px 12px;max-width:92%;overflow-wrap:anywhere}
.ai-msg.you{background:var(--bg);justify-self:end}
.ai-msg.tutor{border:1px solid var(--line)}
.ai-msg p{margin:0 0 6px}
.ai-ask{display:flex;gap:8px}
.ai-dots{display:flex;flex-wrap:wrap;gap:6px}
.ai-dot{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.ai-dot.answered{border-color:var(--accent)}
.ai-dot.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ai-rq{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ai-rq.right{border-color:var(--accent)}.ai-rq.wrong{border-color:var(--danger)}
.ai-rq p{margin:0 0 4px}
.ai-rev{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.ai-del{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
[data-vw="tutor"] .view-head>div{min-width:0}
[data-vw="tutor"] :is(h1,h3,h4,p,li,strong,span,label,code,b,em,.sub){overflow-wrap:anywhere;min-width:0}
.ai-panel,.ai-panel .panel-b{min-width:0;width:100%}
.ai-form,.ai-fs,.ai-sec,.ai-qs,.ai-opts,.ai-courses,.ai-lessons,.ai-chat,.ai-msgs,.ai-rev{grid-template-columns:minmax(0,1fr)}
.ai-lesson-row{grid-template-columns:32px minmax(0,1fr) auto auto}
.ai-row{grid-template-columns:repeat(3,minmax(0,1fr))}
.ai-ask input{flex:1;min-width:0}
.ai-course-card>*{min-width:0}
@media (max-width:560px){.ai-lesson-row{grid-template-columns:32px minmax(0,1fr)}}
li.ai-opt{display:block}
.ai-ok,.ai-bad{white-space:nowrap}
/* Local and CLI sources (desktop app) */
.ai-source{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 0 14px}
.ai-tabs{display:inline-flex;gap:6px}
.ai-tab{font:inherit;font-weight:600;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:40px}
.ai-tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.ai-linkbtn{font:inherit;font-size:14px;background:none;border:0;padding:6px 2px;color:var(--ink);text-decoration:underline;cursor:pointer;min-height:36px}
.ai-hw{margin:0;font-size:14px;color:var(--ink)}
.ai-levels{display:flex;flex-wrap:wrap;gap:8px}
.ai-level-btn[aria-pressed="true"],.ai-course-card[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ai-model{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.ai-model p{margin:4px 0 0}
.ai-offer{border:1px dashed var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:10px}
.ai-offer p{margin:0}
.ai-models h4{margin:6px 0 8px}
.ai-models .ai-courses{padding:0}
.ai-tools{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ai-tool{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:6px;justify-items:start}
.ai-tool .ai-note{margin:0}
.ai-badge{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px;margin-left:6px}
.ai-badge.ok{color:var(--ink);border-color:var(--accent)}
.ai-usage{margin:8px 0 0;font-size:13px;color:var(--muted)}
#ai-local-progress{display:grid;gap:6px}
#ai-local-progress .ai-note{margin:0}
#ai-local .btn[disabled],#ai-cli .btn[disabled]{opacity:.5;cursor:not-allowed}
#ai-local .actions .btn,#ai-cli .actions .btn{max-width:100%;white-space:normal;text-align:center}
#ai-local-err:empty,#ai-cli-err:empty{height:0;min-height:0;margin:-14px 0 0;padding:0}
@media (max-width:520px){.ai-source{align-items:flex-start}}
/* AI Tutor: boxes, formula and steps that the page draws from the AI's tagged lines */
.ai-box{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-left-width:4px;border-radius:10px;background:var(--bg);padding:10px 12px;margin:2px 0 8px;overflow-wrap:anywhere}
.ai-box>div{min-width:0}
.ai-ico{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1;background:var(--muted);color:var(--surface)}
.ai-b-tip{border-left-color:var(--accent)}.ai-b-tip .ai-ico{background:var(--accent);color:var(--accent-ink)}
.ai-b-note{border-left-color:var(--muted)}
.ai-b-warn{border-left-color:var(--danger)}.ai-b-warn .ai-ico{background:var(--danger);color:var(--surface)}
.ai-formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:2px 0 8px;overflow-x:auto;overflow-wrap:normal;white-space:pre-wrap;word-break:break-word}
.ai-steps{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px;counter-reset:aistep}
.ai-steps li{counter-increment:aistep;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.ai-steps li::before{content:counter(aistep);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
#ai-local-toobig{margin-top:14px}
#ai-local-toobig h4{margin:0 0 6px}
#ai-local-toobig .ai-courses{padding:0}
.ai-card-off{cursor:default;opacity:.7;border-style:dashed}
.ai-card-off:hover{border-color:var(--line)}
</style>
</head>

<script>
(function(){
'use strict';
var STANDALONE=true, NOAUTH=true, AI_ON=true; /* the build step sets this to true for the single-file version with sign-in */

/* ---------- helpers ---------- */
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function pad(n){ return n<10?'0'+n:''+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parse(s){ var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function today(){ return ymd(new Date()); }
function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function diffDays(a,b){ return Math.round((parse(a)-parse(b))/864e5); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtShort(s){ var d=parse(s); return d.getDate()+' '+MON[d.getMonth()]; }
function fmtLong(s){ var d=parse(s); return DAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(); }
function rel(s){
  var n=diffDays(s,today());
  if(n===0) return 'Today'; if(n===1) return 'Tomorrow'; if(n===-1) return 'Yesterday';
  return n>0 ? 'in '+n+' days' : Math.abs(n)+' days ago';
}
function relClass(s,done){ if(done) return ''; var n=diffDays(s,today()); return n<0?'late':(n<=2?'hot':''); }
function pct(score,max){ return max>0 ? Math.round(score/max*1000)/10 : 0; }
function num(v){ if(v===''||v==null) return null; var n=Number(String(v).replace(',','.')); return isFinite(n)?n:null; }
var TYPE_NAME={exam:'Exam',assignment:'Assignment',project:'Project',other:'Other'};

/* ---------- state ---------- */
var state=null;
var ui={view:'overview',cal:{y:0,m:0,sel:today()},filter:'all',editLinks:false,confirm:null};
(function(){ var d=new Date(); ui.cal.y=d.getFullYear(); ui.cal.m=d.getMonth(); })();
var VIEWS=['overview','calendar','todo','grades','links'];

/* Everything read from storage or the synced document is rebuilt field by field, so ids, dates, types and
   addresses can never carry markup into the page, whatever was saved. */
var ID_RE=/^[A-Za-z0-9_-]{1,40}$/, DATE_RE=/^\d{4}-\d{2}-\d{2}$/, TIME_RE=/^\d{2}:\d{2}$/;
var KNOWN_TYPES={exam:1,assignment:1,project:1,other:1};
function cleanStr(v,n){ return (typeof v==='string'||typeof v==='number')?String(v).slice(0,n):''; }
function cleanId(v){ return (typeof v==='string'&&ID_RE.test(v))?v:uid(); }
function cleanDate(v){ return (typeof v==='string'&&DATE_RE.test(v)&&ymd(parse(v))===v)?v:''; }
function cleanNum(v,fb){ var n=typeof v==='number'?v:num(v); return (n!==null&&isFinite(n))?n:fb; }
function normalize(s){
  s=(s&&typeof s==='object')?s:{};
  var events=(Array.isArray(s.events)?s.events:[]).map(function(e){
    if(!e||typeof e!=='object') return null;
    var date=cleanDate(e.date); if(!date) return null;
    var mx=cleanNum(e.max,100); if(mx<=0) mx=100;
    var out={id:cleanId(e.id),type:KNOWN_TYPES[e.type]===1?e.type:'other',title:cleanStr(e.title,120),course:cleanStr(e.course,60),
      date:date,endDate:cleanDate(e.endDate),time:(typeof e.time==='string'&&TIME_RE.test(e.time))?e.time:'',
      score:(e.score===null||e.score===undefined||e.score==='')?null:cleanNum(e.score,null),max:mx,note:cleanStr(e.note,500)};
    if(e.sample===true) out.sample=true;
    return out;
  }).filter(Boolean);
  var tasks=(Array.isArray(s.tasks)?s.tasks:[]).map(function(t){
    if(!t||typeof t!=='object') return null;
    var due=cleanDate(t.due); if(!due) return null;
    var out={id:cleanId(t.id),title:cleanStr(t.title,120),course:cleanStr(t.course,60),due:due,done:t.done===true,note:cleanStr(t.note,500)};
    if(t.sample===true) out.sample=true;
    return out;
  }).filter(Boolean);
  var links=(Array.isArray(s.links)?s.links:[]).map(function(l){
    if(!l||typeof l!=='object') return null;
    var url=normUrl(l.url); if(!url) return null;
    var out={id:cleanId(l.id),name:cleanStr(l.name,40)||hostOf(url),url:url};
    if(l.sample===true) out.sample=true;
    return out;
  }).filter(Boolean);
  return {v:1,events:events,tasks:tasks,links:links};
}
function sampleData(){
  var t=today(), A=function(n){ return addDays(t,n); };
  return normalize({
    events:[
      {id:uid(),type:'exam',title:'Calculus II midterm',course:'Calculus II',date:A(6),time:'10:00',score:null,max:100,note:'Chapters 5 to 8',sample:true},
      {id:uid(),type:'exam',title:'Physics quiz 2',course:'Physics',date:A(13),time:'14:30',score:null,max:50,note:'',sample:true},
      {id:uid(),type:'exam',title:'Calculus II quiz 1',course:'Calculus II',date:A(-9),time:'09:00',score:88,max:100,note:'',sample:true},
      {id:uid(),type:'exam',title:'Data Structures quiz 1',course:'Data Structures',date:A(-12),time:'11:00',score:41,max:50,note:'',sample:true},
      {id:uid(),type:'exam',title:'Literature essay exam',course:'Literature',date:A(-20),time:'13:00',score:74,max:100,note:'',sample:true},
      {id:uid(),type:'project',title:'Data Structures project',course:'Data Structures',date:A(-3),endDate:A(16),time:'',note:'Hash map implementation and write-up',sample:true},
      {id:uid(),type:'project',title:'Literature group presentation',course:'Literature',date:A(9),endDate:A(9),time:'15:00',note:'',sample:true}
    ],
    tasks:[
      {id:uid(),title:'Physics lab report 3',course:'Physics',due:A(2),done:false,note:'',sample:true},
      {id:uid(),title:'Calculus problem set 7',course:'Calculus II',due:A(4),done:false,note:'',sample:true},
      {id:uid(),title:'Reading response, chapters 5 and 6',course:'Literature',due:A(-1),done:false,note:'',sample:true},
      {id:uid(),title:'Data Structures homework 4',course:'Data Structures',due:A(8),done:false,note:'',sample:true},
      {id:uid(),title:'Literature essay draft',course:'Literature',due:A(-5),done:true,note:'',sample:true}
    ],
    links:[
      {id:uid(),name:'Google Drive',url:'https://drive.google.com',sample:true},
      {id:uid(),name:'Gmail',url:'https://mail.google.com',sample:true},
      {id:uid(),name:'YouTube',url:'https://www.youtube.com',sample:true},
      {id:uid(),name:'Google Scholar',url:'https://scholar.google.com',sample:true},
      {id:uid(),name:'Wikipedia',url:'https://www.wikipedia.org',sample:true},
      {id:uid(),name:'Khan Academy',url:'https://www.khanacademy.org',sample:true}
    ]
  });
}
function hasSamples(){
  return !!state && (state.events.some(function(x){return x.sample;})||state.tasks.some(function(x){return x.sample;})||state.links.some(function(x){return x.sample;}));
}
function courses(){
  var seen={}, out=[];
  state.events.concat(state.tasks).forEach(function(x){ if(x.course&&!seen[x.course]){ seen[x.course]=1; out.push(x.course); } });
  return out.sort();
}

/* ---------- storage: private account document when available, browser storage otherwise ---------- */
var LS_KEY='study-desk-v1';
var store={mode:'local',ref:null,lastJson:'',writing:false,dirty:false,timer:null,answered:false};
function snapshot(){ return JSON.stringify(state); }
function setStatus(s,t){
  $$('.status').forEach(function(n){ n.setAttribute('data-s',s); $('.status-t',n).textContent=t; });
}
function lsRead(){ try{ var r=localStorage.getItem(LS_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function lsWrite(){ try{ localStorage.setItem(LS_KEY,snapshot()); }catch(e){} }
function changed(){
  render();
  lsWrite();
  if(store.mode==='db'){ setStatus('saving','Saving'); clearTimeout(store.timer); store.timer=setTimeout(flush,450); }
  else setStatus('local','Saved in this browser');
}
function flush(){
  if(store.mode!=='db'||!store.ref||!state) return;
  if(store.writing){ store.dirty=true; return; }
  var json=snapshot();
  if(json===store.lastJson){ setStatus('synced','Saved to your account'); return; }
  store.writing=true; store.dirty=false; store.lastJson=json;
  store.ref.set(JSON.parse(json)).then(function(){
    store.writing=false;
    if(store.dirty) flush(); else setStatus('synced','Saved to your account');
  },function(){
    store.writing=false; store.lastJson='';
    setStatus('error','Not saved. Kept in this browser');
  });
}
function useLocalOnly(){
  store.mode='local';
  if(!state){ state=sampleData(); lsWrite(); }
  setStatus('local','Saved in this browser');
  render();
}
async function connect(){
  var warn=setTimeout(function(){ if(!store.answered) setStatus('local','Waiting for your saved data'); },10000);
  var db=null,user=null,id=null;
  try{ db=await claude.use('db'); user=await claude.use('user'); if(user) id=await user.id(); }catch(e){}
  if(!db||!id){ clearTimeout(warn); useLocalOnly(); return; }
  var ref=db.collection('data/users/'+id).doc('planner');
  store.ref=ref; store.mode='db';
  ref.onSnapshot(function(snap){
    if(snap.metadata.hasPendingWrites) return;
    if(!snap.metadata.fromCache){ store.answered=true; clearTimeout(warn); }
    if(snap.exists){
      var json=JSON.stringify(snap.data());
      if(json!==store.lastJson){
        store.lastJson=json; state=normalize(JSON.parse(json)); lsWrite(); render();
      }
      if(store.answered) setStatus('synced','Saved to your account');
    }else if(store.answered){
      if(!state) state=sampleData();
      store.lastJson=''; lsWrite(); render(); flush();
    }
  },function(){
    clearTimeout(warn); store.mode='local';
    if(!state) state=sampleData();
    setStatus('error','Account storage unavailable. Using this browser');
    render();
  });
}

/* ---------- mutations ---------- */
function findEvent(id){ for(var i=0;i<state.events.length;i++) if(state.events[i].id===id) return state.events[i]; return null; }
function findTask(id){ for(var i=0;i<state.tasks.length;i++) if(state.tasks[i].id===id) return state.tasks[i]; return null; }
function removeById(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id){ list.splice(i,1); return; } }
function clearSamples(){
  state.events=state.events.filter(function(x){return !x.sample;});
  state.tasks=state.tasks.filter(function(x){return !x.sample;});
  state.links=state.links.filter(function(x){return !x.sample;});
  changed();
}

/* ---------- calendar data ---------- */
function itemsOn(date){
  var out=[];
  state.events.forEach(function(e){
    var end=(e.endDate&&e.endDate>=e.date)?e.endDate:e.date;
    if(date>=e.date&&date<=end) out.push({kind:e.type,src:'event',id:e.id,title:e.title,course:e.course,time:e.time||'',span:end!==e.date,first:date===e.date,last:date===end,ref:e});
  });
  state.tasks.forEach(function(t){
    if(t.due===date) out.push({kind:'assignment',src:'task',id:t.id,title:t.title,course:t.course,time:'',done:t.done,ref:t});
  });
  out.sort(function(a,b){
    if(a.time!==b.time) return a.time===''?1:(b.time===''?-1:(a.time<b.time?-1:1));
    return a.title<b.title?-1:1;
  });
  return out;
}
function upcoming(days){
  var t=today(), out=[];
  for(var i=0;i<=days;i++){
    var d=addDays(t,i);
    itemsOn(d).forEach(function(it){
      if(it.src==='task'&&it.done) return;
      if(it.span&&!it.first&&i>0) return;
      out.push({date:d,it:it});
    });
  }
  return out;
}

/* ---------- link helpers ---------- */
function normUrl(raw){
  var s=String(raw||'').trim(); if(!s) return null;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(s)) s='https://'+s;
  try{ var u=new URL(s); if(u.protocol!=='https:'&&u.protocol!=='http:') return null; if(u.hostname.indexOf('.')<0) return null; return u.href; }catch(e){ return null; }
}
function hostOf(url){ try{ return new URL(url).hostname.replace(/^www\./,''); }catch(e){ return url; } }

  var h=0, s=String(name||'?'); for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360;

/* ---------- polish: entrance, count-up numbers, pointer spotlight ---------- */
var REDUCED=false;
try{ REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
function countUp(el){
  var text=el.textContent.trim(), m=text.match(/^(\d+(?:\.\d+)?)(%?)$/);
  if(!m) return;
  var end=parseFloat(m[1]), dec=(m[1].split('.')[1]||'').length, suffix=m[2], t0=null;
  function step(ts){
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/700), eased=1-Math.pow(1-k,3);
    el.textContent=(end*eased).toFixed(dec)+suffix;
    if(k<1) requestAnimationFrame(step); else el.textContent=text;
  }
  requestAnimationFrame(step);
}
var enterTimer=null;
function playEnter(){
  if(gsapEnter()) return;            /* GSAP builds the entrance when the library is present */
  if(REDUCED) return;
  var v=$('#view'); if(!v) return;
  v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
  $$('.glance .v',v).forEach(countUp);
  clearTimeout(enterTimer);
  enterTimer=setTimeout(function(){ v.classList.remove('enter'); },1000);
}
(function spotlight(){
  /* the highlight follows the pointer; with GSAP it eases behind it via quickTo, without GSAP it is set directly */
  var raf=0, last=null, cur=null, pos={x:0,y:0}, qx=null, qy=null, seeded=false;
  function paint(){
    if(!cur||!document.contains(cur)) return;
    var r=cur.getBoundingClientRect();
    cur.style.setProperty('--mx',(pos.x-r.left)+'px');
    cur.style.setProperty('--my',(pos.y-r.top)+'px');
  }
  function smooth(){
    if(qx||REDUCED||!window.gsap||!window.gsap.quickTo) return !!qx;
    qx=gsap.quickTo(pos,'x',{duration:.35,ease:'power3',onUpdate:paint});
    qy=gsap.quickTo(pos,'y',{duration:.35,ease:'power3',onUpdate:paint});
    return true;
  }
  document.addEventListener('pointermove',function(e){
    if(e.pointerType==='touch') return;
    last=e;
    if(raf) return;
    raf=requestAnimationFrame(function(){
      raf=0;
      var t=last.target&&last.target.closest?last.target.closest('.panel,.lk,.glance>div'):null;
      if(!t){ cur=null; return; }
      cur=t;
      if(smooth()){
        if(!seeded){ pos.x=last.clientX; pos.y=last.clientY; seeded=true; paint(); }
        qx(last.clientX); qy(last.clientY);
      }else{ pos.x=last.clientX; pos.y=last.clientY; paint(); }
    });
  },{passive:true});
})();

/* ---------- GSAP layer ----------
   Progressive enhancement: everything below is skipped when the library did not load, and the page then
   keeps its plain CSS animations. Animated: view entrance (timeline + SplitText title + count-up),
   scroll reveals and a progress bar (ScrollTrigger), list re-ordering (Flip), shortcut re-ordering (Draggable),
   scroll to the day panel (ScrollToPlugin), modal open, pointer highlight (quickTo in p10).
   Only transform and opacity are animated. Motion is skipped when the system asks for reduced motion. */
var GS=null, GSU=null, FL=null, ST=null, DR=null, STX=null;
var mm=null, dragCtx=null, flipTween=null, refreshRaf=0, bar=null;
(function gsapInit(){
  var g=window.gsap;
  if(!g||!g.timeline||!g.matchMedia||!g.utils) return;
  GS=g; GSU=g.utils;
  var plugs=[];
  if(window.ScrollTrigger){ ST=window.ScrollTrigger; plugs.push(ST); }
  if(window.Flip){ FL=window.Flip; plugs.push(FL); }
  if(window.Draggable){ DR=window.Draggable; plugs.push(DR); }
  if(window.ScrollToPlugin){ STX=window.ScrollToPlugin; plugs.push(STX); }
  if(window.SplitText) plugs.push(window.SplitText);
  try{ g.registerPlugin.apply(g,plugs); }catch(e){}
  g.config({nullTargetWarn:false});
  g.defaults({ease:'power3.out',duration:.6});
  if(ST){
    ST.config({ignoreMobileResize:true});
    try{ if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ ST.refresh(); }); }catch(e){}
  }
  document.documentElement.classList.add('has-gsap');
})();

function reduceNow(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }

/* thin bar under the top edge showing how far the page is scrolled */
function mountProgress(){
  if(!ST||bar||reduceNow()) return;
  bar=document.createElement('div'); bar.id='sd-progress'; bar.setAttribute('aria-hidden','true');
  document.body.appendChild(bar);
  var setX=GS.quickSetter(bar,'scaleX'), setO=GS.quickSetter(bar,'opacity');
  var shape=GSU.pipe(GSU.mapRange(0,.03,0,1),GSU.clamp(0,1));
  ST.create({start:0,end:'max',onUpdate:function(self){ setX(GSU.clamp(0,1,self.progress)); setO(shape(self.progress)); }});
}

/* numbers in the summary tiles count up to their value */
function countTo(el,tl,pos,undo){
  var text=el.textContent.trim(), m=text.match(/^(\d+(?:\.\d+)?)(%?)$/);
  if(!m) return;
  var end=parseFloat(m[1]), dec=(m[1].split('.')[1]||'').length, suffix=m[2];
  var lerp=GSU.interpolate(0,end), snap=GSU.snap(dec?Math.pow(10,-dec):1), o={p:0};
  el.textContent=(0).toFixed(dec)+suffix;
  undo.push(function(){ el.textContent=text; });
  tl.to(o,{p:1,duration:.9,ease:'power2.out',onUpdate:function(){ el.textContent=snap(lerp(o.p)).toFixed(dec)+suffix; },onComplete:function(){ el.textContent=text; }},pos);
}

var KEEP='transform,opacity';
function buildEnter(v){
  var undo=[], sp=null, vh=window.innerHeight||800;
  var kids=GSU.toArray(v.children), head=v.querySelector('.view-head');
  var tl=GS.timeline({onComplete:function(){ if(sp){ try{ sp.revert(); }catch(e){} sp=null; } }});

  /* title: words rise in; the rest of the heading follows */
  var h1=head&&head.querySelector('h1');

  if(head) tl.from(GSU.toArray('.sub,.view-actions',head),{y:12,opacity:0,duration:.55,stagger:.08,clearProps:KEEP},.12);

  /* summary tiles + counters */
  var tiles=GSU.toArray('.glance > div',v);

  GSU.toArray('.glance .v',v).forEach(function(el,i){ countTo(el,tl,.3+i*.08,undo); });

  var blocks=kids.filter(function(k){ return k!==head&&k!==wrap&&!k.classList.contains('glance'); });

  if(below.length){
    GS.set(below,{opacity:0,y:30});
    ST.batch(below,{start:'top bottom-=48',once:true,onEnter:function(b){ GS.to(b,{opacity:1,y:0,duration:.75,stagger:.12,overwrite:true,clearProps:KEEP}); }});
  }
  var inView=function(n){ return !!(wrap&&wrap.contains(n))||above.some(function(b){ return b.contains(n); }); };

  /* rows and tiles inside the visible blocks */
  var rows=GSU.toArray('.agenda li, .task, .g-row, .lk',v).filter(inView);
  if(rows.length) tl.from(rows,{x:-12,opacity:0,duration:.5,delay:GSU.distribute({amount:.4,from:'start'}),clearProps:KEEP},.4);

  /* grade bars grow from the left; those further down grow when they scroll into view */
  GSU.toArray('.bar i',v).forEach(function(b,i){
    if(inView(b)) tl.from(b,{scaleX:0,transformOrigin:'0 50%',duration:.9,clearProps:'transform,transformOrigin'},.45+Math.min(i,8)*.05);
    else if(ST) GS.from(b,{scaleX:0,transformOrigin:'0 50%',duration:.9,clearProps:'transform,transformOrigin',scrollTrigger:{trigger:b,start:'top bottom-=24',once:true}});
  });

  return function(){ undo.forEach(function(f){ f(); }); if(sp){ try{ sp.revert(); }catch(e){} } };
}

function gsapDrag(v){
  if(!DR||ui.view!=='links'||!ui.editLinks) return;
  dragCtx=GS.context(function(){
    var tiles=GSU.toArray('.links .lk.editing',v);
    tiles.forEach(function(tile){
      DR.create(tile,{type:'x,y',trigger:tile.querySelector('.tile'),zIndexBoost:true,minimumMovement:6,
        onPress:function(){ tile.classList.add('dragging'); },

          var pe=this.pointerEvent, r0=tile.getBoundingClientRect(), to=-1;
          var cx=(pe&&typeof pe.clientX==='number')?pe.clientX:r0.left+r0.width/2, cy=(pe&&typeof pe.clientY==='number')?pe.clientY:r0.top+r0.height/2;

/* ---------- AI Tutor: validation and grading ----------
   Everything an AI provider returns, or storage hands back, is rebuilt field by field here before it is used. */
function aiStr(v,n){ return (typeof v==='string'||typeof v==='number')?String(v).trim().slice(0,n):''; }
function aiExtractJson(text){
  if(typeof text!=='string') return null;
  for(var s=text.indexOf('{'); s>=0; s=text.indexOf('{',s+1)){
    var depth=0, inStr=false, esc2=false;
    for(var i=s;i<text.length;i++){
      var c=text.charAt(i);
      if(inStr){ if(esc2) esc2=false; else if(c==='\\') esc2=true; else if(c==='"') inStr=false; continue; }
      if(c==='"') inStr=true;
      else if(c==='{') depth++;

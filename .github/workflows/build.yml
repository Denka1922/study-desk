name: Build Study Desk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node scripts/check.js --ci

  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Work out the version
        id: version
        env:
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="$(node scripts/version-from-tag.js "$REF" "$RUN_NUMBER")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build the Windows files
        working-directory: desktop
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-files
          path: desktop/dist/*.exe
          if-no-files-found: error

  macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Work out the version
        id: version
        env:
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="$(node scripts/version-from-tag.js "$REF" "$RUN_NUMBER")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build the Mac files
        working-directory: desktop
        env:
          VERSION: ${{ steps.version.outputs.value }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run dist:mac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-files
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error

  release:
    if: ${{ !cancelled() && needs.windows.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-files
          path: files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: mac-files
          path: files
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd files
          ls Study-Desk-Setup-*.exe
          ls Study-Desk-*-portable.exe
          shopt -s nullglob
          MAC=(Study-Desk-*-mac-*)
          {
            echo "SHA-256 checksums (compare with the file you downloaded):"
            echo
            echo '```'
            sha256sum Study-Desk-Setup-*.exe Study-Desk-*-portable.exe "${MAC[@]}"
            echo '```'
          } > ../notes.md
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            # a Release made by hand in the browser already exists: attach the files to it
            gh release upload "$TAG" Study-Desk-Setup-*.exe Study-Desk-*-portable.exe "${MAC[@]}" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes-file ../notes.md
          else
            gh release create "$TAG" Study-Desk-Setup-*.exe Study-Desk-*-portable.exe "${MAC[@]}" \
              --repo "$REPO" --title "Study Desk $TAG" --notes-file ../notes.md
          fi

  pages:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Verify AI catalog

# Manual only. Re-checks every pinned AI model and engine file in desktop/ai/catalog.json
# against the live source (Hugging Face / GitHub). Run it before a release and whenever the catalog changes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node desktop/ai/tools/pin-catalog.js --verify
